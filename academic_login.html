<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Incharge Login (Prof. Suman Kumar) — GP Munger</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: #fff; }
    .back-home { align-self: flex-start; max-width: 440px; width: 100%; margin: 0 auto 14px; color: #94a3b8; text-decoration: none; font-size: 0.86rem; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
    .back-home:hover { color: #38bdf8; text-decoration: underline; }
    .card { background: #1e293b; width: 100%; max-width: 440px; border-radius: 14px; border: 1px solid #334155; padding: 32px 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .icon-box { width: 56px; height: 56px; border-radius: 12px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 14px; border: 1px solid rgba(56, 189, 248, 0.3); }
    h2 { font-size: 1.35rem; color: #f8fafc; margin-bottom: 4px; font-weight: 700; }
    p { font-size: 0.82rem; color: #94a3b8; margin-bottom: 18px; }
    .quick-creds { background: rgba(0,0,0,0.25); border: 1px dashed #475569; padding: 12px; border-radius: 8px; font-size: 0.78rem; color: #cbd5e1; margin-bottom: 18px; line-height: 1.6; }
    .quick-creds code { color: #38bdf8; font-weight: 700; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.74rem; font-weight: 800; color: #cbd5e1; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .input-box { width: 100%; padding: 11px 14px; border: 1px solid #475569; background: #0f172a; color: #fff; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .input-box:focus { border-color: #38bdf8; }
    .btn-submit { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-submit:hover { background: #0ea5e9; }
  </style>
</head>
<body>
  <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Main Portal</a>
  <div class="card">
    <div class="icon-box"><i class="fa-solid fa-chalkboard-user"></i></div>
    <h2>Academic Incharge Desk</h2>
    <p>Sign in for Prof. Sumat Kumar (Classrooms &amp; Academic Block)</p>
    <div class="quick-creds">
      <strong>Credentials:</strong><br>
      &bull; Staff ID: <code>suman_kumar</code><br>
      &bull; Password: <code>suman123</code>
    </div>
    <form onsubmit="handleLogin(event, 'suman_kumar', 'suman123')">
      <div class="form-group">
        <label>Staff ID</label>
        <input type="text" class="input-box" value="suman_kumar" readonly style="background:#111827; color:#38bdf8;">
      </div>
      <div class="form-group">
        <label>Secret Password</label>
        <input type="password" class="input-box" id="s-pwd" value="suman123" required>
      </div>
      <button type="submit" class="btn-submit">Login to Academic Desk</button>
    </form>
  </div>
  <script src="app.js"></script>
  <script>
    async function handleLogin(e, id, defaultPwd) {
      e.preventDefault();
      const password = document.getElementById('s-pwd').value.trim();
      const res = await sendRequest('/auth/academic-login', 'POST', { id, password });
      if (res.ok) {
        sessionStorage.setItem('gpm_academic_staff', JSON.stringify(res.data.user));
        window.location.href = 'academic_dashboard.html';
      } else {
        alert(res.data.message || "Invalid Credentials!");
      }
    }
  </script>
</body>
</html>
