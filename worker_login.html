<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Maintenance Worker Login — GP Munger</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: #fff; }

    .back-home { align-self: flex-start; max-width: 440px; width: 100%; margin: 0 auto 14px; color: #94a3b8; text-decoration: none; font-size: 0.86rem; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
    .back-home:hover { color: #f59e0b; text-decoration: underline; }

    .card { background: #1e293b; width: 100%; max-width: 440px; border-radius: 14px; border: 1px solid #334155; padding: 32px 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .icon-box { width: 56px; height: 56px; border-radius: 12px; background: rgba(245, 158, 11, 0.15); color: #f59e0b; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 14px; border: 1px solid rgba(245, 158, 11, 0.3); }
    h2 { font-size: 1.35rem; color: #f8fafc; margin-bottom: 4px; font-weight: 700; }
    p { font-size: 0.82rem; color: #94a3b8; margin-bottom: 18px; }

    .quick-creds { background: rgba(0,0,0,0.25); border: 1px dashed #475569; padding: 12px; border-radius: 8px; font-size: 0.78rem; color: #cbd5e1; margin-bottom: 18px; line-height: 1.6; }
    .quick-creds code { color: #facc15; font-weight: 700; }
    
    .worker-quick-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
    .btn-quick-w { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 6px 4px; font-size: 0.72rem; border-radius: 6px; font-weight: 700; cursor: pointer; text-align: center; }
    .btn-quick-w:hover { background: #f59e0b; color: #0f172a; border-color: #f59e0b; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.74rem; font-weight: 800; color: #cbd5e1; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .input-box { width: 100%; padding: 11px 14px; border: 1px solid #475569; background: #0f172a; color: #fff; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .input-box:focus { border-color: #f59e0b; }

    .btn-submit { width: 100%; padding: 12px; background: #f59e0b; color: #0f172a; border: none; border-radius: 6px; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-submit:hover { background: #d97706; }
  </style>
</head>
<body>

  <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Main Portal</a>

  <div class="card">
    <div class="icon-box"><i class="fa-solid fa-wrench"></i></div>
    <h2>Worker &amp; Maintenance Terminal</h2>
    <p>Sign in to resolve assigned hostel complaints &amp; upload proof</p>

    <div class="quick-creds">
      <strong>Active Maintenance Team:</strong><br>
      Password for all: <code>worker123</code>
      <div class="worker-quick-btns">
        <button type="button" class="btn-quick-w" onclick="selectWorker('worker_shailee')">Shailee</button>
        <button type="button" class="btn-quick-w" onclick="selectWorker('worker_ranjeet')">Ranjeet</button>
        <button type="button" class="btn-quick-w" onclick="selectWorker('worker_amit')">Amit</button>
      </div>
    </div>

    <form onsubmit="handleWorkerLogin(event)">
      <div class="form-group">
        <label>Worker ID</label>
        <input type="text" class="input-box" id="w-id" value="worker_shailee" required>
      </div>

      <div class="form-group">
        <label>Secret Password</label>
        <input type="password" class="input-box" id="w-pwd" value="worker123" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-login-text">Access Task Dashboard</button>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    function selectWorker(id) {
      document.getElementById('w-id').value = id;
      document.getElementById('w-pwd').value = 'worker123';
    }

    async function handleWorkerLogin(e) {
      e.preventDefault();
      const id = document.getElementById('w-id').value.trim();
      const password = document.getElementById('w-pwd').value.trim();

      const btn = document.getElementById('btn-login-text');
      btn.innerText = "Verifying Clearance...";
      btn.disabled = true;

      const res = await sendRequest('/auth/worker-login', 'POST', { id, password });
      btn.innerText = "Access Task Dashboard";
      btn.disabled = false;

      if (res.ok) {
        // Normal Worker login par inspection tokens wipe out
        sessionStorage.removeItem('gpm_principal');
        sessionStorage.removeItem('gpm_inspection_active');
        sessionStorage.setItem('gpm_worker', JSON.stringify(res.data.user));
        window.location.href = 'worker.html';
      } else {
        alert(res.data.message || "Invalid Worker credentials!");
      }
    }
  </script>
</body>
</html>
