<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Office Sign In — GP Munger</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { background: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

    .back-home-top {
      align-self: flex-start;
      max-width: 420px;
      width: 100%;
      margin: 0 auto 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #475569;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .back-home-top:hover { color: #0a192f; text-decoration: underline; }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      padding: 34px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .login-icon {
      width: 52px; height: 52px; border-radius: 12px; background: #eff6ff; color: #2563eb;
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 14px;
    }
    h2 { font-size: 1.35rem; color: #0f172a; margin-bottom: 4px; font-weight: 700; }
    p { font-size: 0.84rem; color: #64748b; margin-bottom: 22px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.76rem; font-weight: 700; color: #334155; text-transform: uppercase; margin-bottom: 6px; }
    .input-box { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .input-box:focus { border-color: #0a192f; }

    .btn-submit {
      width: 100%; padding: 12px; background: #0a192f; color: #ffffff; border: none;
      border-radius: 6px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 10px;
    }
    .btn-submit:hover { background: #132d54; }
  </style>
</head>
<body>

  <a href="index.html" class="back-home-top"><i class="fa-solid fa-arrow-left"></i> Back to Main Portal</a>

  <div class="login-card">
    <div class="login-icon"><i class="fa-solid fa-building-columns"></i></div>
    <h2>Admin Office Desk</h2>
    <p>Sign in for admissions, Excel bulk import, and student fee verification</p>

    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Admin ID</label>
        <input type="text" class="input-box" id="admin-id" value="admin" required>
      </div>

      <div class="form-group">
        <label>Secret Password</label>
        <input type="password" class="input-box" id="admin-pwd" value="superadmin" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-adm-sub">Sign In to Admin Office</button>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    async function handleAdminLogin(e) {
      e.preventDefault();
      const id = document.getElementById('admin-id').value.trim();
      const password = document.getElementById('admin-pwd').value.trim();

      const btn = document.getElementById('btn-adm-sub');
      btn.innerText = "Verifying...";
      btn.disabled = true;

      const res = await sendRequest('/auth/admin-login', 'POST', { id, password });
      btn.innerText = "Sign In to Admin Office";
      btn.disabled = false;

      if (res.ok) {
        // Normal Admin login par principal inspection flag bilkul clear ho jayega
        sessionStorage.removeItem('gpm_principal');
        sessionStorage.removeItem('gpm_inspection_active');
        sessionStorage.setItem('gpm_admin', JSON.stringify(res.data.user));
        window.location.href = 'admin.html';
      } else {
        alert(res.data.message || "Invalid Admin Credentials!");
      }
    }
  </script>
</body>
</html>
